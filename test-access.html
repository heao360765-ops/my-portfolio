<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>access card test</title>
<link rel="stylesheet" href="intro.css">
<style>
  html,body{margin:0;height:100%;background:#ffffff;font-family:Inter,'Microsoft YaHei',sans-serif}
  .portfolio-intro{
    position:static!important;display:grid;place-items:center;
    width:100%!important;height:100%!important;
    --phase:1;--reveal:1;
  }
  .portfolio-intro .intro-scene{
    position:static!important;inset:auto!important;display:grid;place-items:center;
    visibility:visible!important;opacity:1!important;pointer-events:auto!important;
    width:100%;padding:40px 0;
  }
</style>
</head>
<body>
<div class="portfolio-intro">
  <section class="intro-scene intro-confirm">
    <div class="access-card">
      <div class="access-title">
        <span>SEEDLAB</span>
        <small>PRIVATE WORKSTATION ACCESS</small>
      </div>
      <div class="access-form">
        <div class="access-field">
          <small>OPERATOR ID</small>
          <p>operator</p>
        </div>
        <div class="access-field">
          <small>PASSWORD</small>
          <p class="password-dots">********</p>
        </div>
      </div>
      <div class="access-state">
        <i></i>
        <span>IDENTIFIED / 0009</span>
      </div>
    </div>
  </section>
</div>
</body></html>
